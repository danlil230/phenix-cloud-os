<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Феник Cloud OS — Google Drive Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden; }
        
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #00ff66;
            font-family: 'Courier New', Courier, monospace; padding: 40px; z-index: 100; display: flex; flex-direction: column; justify-content: space-between; transition: opacity 0.8s ease;
        }
        .console-text { white-space: pre-line; font-size: 16px; line-height: 1.5; }
        
        #logo-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90; opacity: 0; pointer-events: none; transition: opacity 1s ease;
        }
        .cat-logo { font-size: 72px; margin-bottom: 20px; animation: pulse 1.5s infinite alternate; }
        .win-spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #4285F4; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 30px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }

        #main-app { display: none; height: 100vh; flex-direction: column; background: #0f172a; }
        header { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; color: #f8fafc; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .content { flex: 1; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .cloud-box { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 600px; width: 100%; border: 1px solid #334155; }
        .file-list { margin-top: 20px; text-align: left; max-height: 250px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 10px; }
        .file-item { padding: 10px 12px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    </style>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</head>
<body>

    <div id="boot-screen">
        <div class="console-text" id="console"></div>
        <div style="color: #58a6ff; font-size: 14px;">PHENIX KERNEL v40.0 - GOOGLE DRIVE API SYNC</div>
    </div>

    <div id="logo-screen">
        <div class="cat-logo">🐈‍⬛🔥</div>
        <h2 style="color: #fff; margin-top: 10px;">Феник Cloud OS</h2>
        <div class="win-spinner"></div>
    </div>

    <div id="main-app">
        <header>
            <div class="brand"><span>🐈‍⬛</span> Феник Google Drive Hub</div>
            <button class="btn" id="auth-btn" style="background: #22c55e;">Подключиться к облаку</button>
        </header>
        <div class="content">
            <div class="cloud-box">
                <h2 style="margin-bottom: 15px; color: #f8fafc;">Ваш реальный Google Диск</h2>
                <p id="status-text" style="color: #94a3b8; margin-bottom: 25px;">Нажмите кнопку вверху для авторизации.</p>
                <button class="btn" id="create-file-btn" style="display: none;">+ Создать файл на Диске</button>
                <div class="file-list" id="files">
                    <div class="file-item" style="color: #64748b;">Здесь появятся файлы с вашего диска...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '291176890400-k9fbeduasamqn1aujs85ea2g2sa0r38a.apps.googleusercontent.com';
        const API_KEY = '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';
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        const consoleEl = document.getElementById('console');
        const bootScreen = document.getElementById('boot-screen');
        const logoScreen = document.getElementById('logo-screen');
        const mainApp = document.getElementById('main-app');

        const logs = [
            "Initializing Phenix Security Subsystem...",
            "Loading Secret Protocol #40...",
            "Bypassing Roskomnadzor DPI filters...",
            "Establishing secure tunnel with Google Drive API...",
            "All systems nominal. Welcome back, Boss."
        ];

        let lineIdx = 0;
        function typeLogs() {
            if (lineIdx < logs.length) {
                consoleEl.innerText += "> " + logs[lineIdx] + "\n";
                lineIdx++;
                setTimeout(typeLogs, 300);
            } else {
                setTimeout(() => {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => {
                        bootScreen.style.display = 'none';
                        logoScreen.style.opacity = '1';
                        setTimeout(() => {
                            logoScreen.style.opacity = '0';
                            setTimeout(() => {
                                logoScreen.style.display = 'none';
                                mainApp.style.display = 'flex';
                            }, 800);
                        }, 1800);
                    }, 800);
                }, 400);
            }
        }
        setTimeout(typeLogs, 400);

        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '',
            });
            gisInited = true;
        }

        const authBtn = document.getElementById('auth-btn');
        const createFileBtn = document.getElementById('create-file-btn');
        const statusText = document.getElementById('status-text');

        authBtn.addEventListener('click', handleAuthClick);
        createFileBtn.addEventListener('click', createTestFile);

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    throw (resp);
                }
                authBtn.innerText = 'Подключено ✓';
                authBtn.style.background = '#059669';
                statusText.innerText = 'Синхронизация с 5 ТБ хранилища активна!';
                createFileBtn.style.display = 'inline-block';
                listUserFiles();
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        async function listUserFiles() {
            try {
                const response = await gapi.client.drive.files.list({
                    'pageSize': 10,
                    'fields': 'files(id, name)',
                });
                const files = response.result.files;
                const fileList = document.getElementById('files');
                fileList.innerHTML = '';
                
                if (!files || files.length === 0) {
                    fileList.innerHTML = '<div class="file-item" style="color: #64748b;">Файлы не найдены.</div>';
                    return;
                }
                
                files.forEach((file) => {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerHTML = `📁 ${file.name}<span style="color: #38bdf8;">ID: ${file.id.substring(0,6)}...</span>`;
                    fileList.appendChild(div);
                });
            } catch (err) {
                console.error("Ошибка загрузки файлов", err);
            }
        }

        async function createTestFile() {
            const metadata = {
                'name': 'Феник_Документ_' + Math.floor(Math.random() * 1000) + '.txt',
                'mimeType': 'text/plain'
            };
            const fileContent = 'Привет от Феник Cloud OS! Секретный протокол #40 работает безупречно.';
            const accessToken = gapi.client.getToken().access_token;

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'text/plain' }));

            await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: 'POST',
                headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                body: form,
            });

            alert('Файл успешно создан на твоем Google Диске!');
            listUserFiles();
        }
    </script>
</body>
</html>
